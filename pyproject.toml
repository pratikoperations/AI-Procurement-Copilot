[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"modules/ux_acceptance_corrections.py" = ["B010"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "modules.ux_acceptance_corrections",
  "modules.decision_clarity_ui",
  "modules.sourcemate_global_context",
]
disallow_untyped_defs = true
