name: Mobile Browser Acceptance

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  mobile-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      MOBILE_ACCEPTANCE_BASE_URL: http://127.0.0.1:8501

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser-test dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Audit browser-test dependencies
        run: npm run audit:mobile

      - name: Start Streamlit application
        run: |
          streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > /tmp/aipc-streamlit.log 2>&1 &
          echo $! > /tmp/aipc-streamlit.pid

      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aipc-streamlit.log
          exit 1

      - name: Run six-viewport mobile acceptance
        run: npm run test:mobile

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-acceptance-evidence
          path: |
            playwright-report
            test-results/mobile-acceptance
            /tmp/aipc-streamlit.log
          if-no-files-found: warn
          retention-days: 14
