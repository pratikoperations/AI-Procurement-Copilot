<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F4F7FB"/><text x="800" y="80" text-anchor="middle" font-family="Arial" font-size="46" font-weight="700" fill="#132238">What the Project Proves — and Does Not Prove</text><rect x="65" y="130" width="710" height="690" rx="24" fill="#F0FBF7" stroke="#B7E5D3"/><text x="105" y="195" font-family="Arial" font-size="32" font-weight="700" fill="#13795B">What it proves</text><g font-family="Arial" font-size="22" fill="#132238"><circle cx="120" cy="260" r="8" fill="#13795B"/><text x="145" y="268">Procurement workflow understanding</text><circle cx="120" cy="350" r="8" fill="#13795B"/><text x="145" y="358">Working decision-support application</text><circle cx="120" cy="440" r="8" fill="#13795B"/><text x="145" y="448">Category-aware sourcing logic</text><circle cx="120" cy="530" r="8" fill="#13795B"/><text x="145" y="538">Controlled validation and eligibility</text><circle cx="120" cy="620" r="8" fill="#13795B"/><text x="145" y="628">Automated regression testing</text><circle cx="120" cy="710" r="8" fill="#13795B"/><text x="145" y="718">Release and governance discipline</text></g><rect x="825" y="130" width="710" height="690" rx="24" fill="#FFF5F4" stroke="#F3C1BC"/><text x="865" y="195" font-family="Arial" font-size="32" font-weight="700" fill="#B42318">What it does not prove</text><g font-family="Arial" font-size="22" fill="#132238"><text x="870" y="268" fill="#B42318">×</text><text x="910" y="268">Production deployment</text><text x="870" y="358" fill="#B42318">×</text><text x="910" y="358">Live ERP integration</text><text x="870" y="448" fill="#B42318">×</text><text x="910" y="448">Realized savings</text><text x="870" y="538" fill="#B42318">×</text><text x="910" y="538">Enterprise-scale performance</text><text x="870" y="628" fill="#B42318">×</text><text x="910" y="628">Autonomous procurement decisions</text><text x="870" y="718" fill="#B42318">×</text><text x="910" y="718">Validation using live organizational data</text></g></svg>