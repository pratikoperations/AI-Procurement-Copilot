<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F4F7FB"/><text x="800" y="75" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#132238">Five-Stage Architecture</text><text x="800" y="115" text-anchor="middle" font-family="Arial" font-size="16" fill="#5B6B7F">Read-only, validation-gated and human-controlled</text><g font-family="Arial"><rect x="245" y="155" width="1110" height="105" rx="18" fill="#fff" stroke="#D8E0EA"/><circle cx="300" cy="207" r="28" fill="#1F5EFF"/><text x="300" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text><text x="350" y="198" font-size="22" font-weight="700" fill="#132238">Procurement and RFQ Data</text><text x="350" y="232" font-size="16" fill="#5B6B7F">Synthetic demo or user-uploaded files</text><line x1="800" y1="260" x2="800" y2="300" stroke="#1F5EFF" stroke-width="4"/><polygon points="790,295 810,295 800,310" fill="#1F5EFF"/><rect x="245" y="310" width="1110" height="105" rx="18" fill="#fff" stroke="#D8E0EA"/><circle cx="300" cy="362" r="28" fill="#1F5EFF"/><text x="300" y="371" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text><text x="350" y="353" font-size="22" font-weight="700" fill="#132238">Validation and Controlled Transformation</text><text x="350" y="387" font-size="16" fill="#5B6B7F">Schema, quality, currency and unit checks</text><line x1="800" y1="415" x2="800" y2="455" stroke="#1F5EFF" stroke-width="4"/><polygon points="790,450 810,450 800,465" fill="#1F5EFF"/><rect x="245" y="465" width="1110" height="105" rx="18" fill="#fff" stroke="#D8E0EA"/><circle cx="300" cy="517" r="28" fill="#1F5EFF"/><text x="300" y="526" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text><text x="350" y="508" font-size="22" font-weight="700" fill="#132238">Category-Aware Comparison and Decision Logic</text><text x="350" y="542" font-size="16" fill="#5B6B7F">Cost, risk, scoring, allocation and eligibility</text><line x1="800" y1="570" x2="800" y2="610" stroke="#1F5EFF" stroke-width="4"/><polygon points="790,605 810,605 800,620" fill="#1F5EFF"/><rect x="245" y="620" width="1110" height="105" rx="18" fill="#fff" stroke="#D8E0EA"/><circle cx="300" cy="672" r="28" fill="#1F5EFF"/><text x="300" y="681" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text><text x="350" y="663" font-size="22" font-weight="700" fill="#132238">Business-Facing Views and Downloads</text><text x="350" y="697" font-size="16" fill="#5B6B7F">Executive views, reports and audit outputs</text><line x1="800" y1="725" x2="800" y2="765" stroke="#1F5EFF" stroke-width="4"/><polygon points="790,760 810,760 800,775" fill="#1F5EFF"/><rect x="245" y="775" width="1110" height="90" rx="18" fill="#EAF0FF" stroke="#C5D3FF"/><circle cx="300" cy="820" r="28" fill="#1F5EFF"/><text x="300" y="829" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text><text x="350" y="812" font-size="22" font-weight="700" fill="#132238">Human Procurement Review and Action</text><text x="350" y="846" font-size="16" fill="#5B6B7F">Commercial judgement, approval and follow-up — no autonomous award or ERP write-back</text></g></svg>