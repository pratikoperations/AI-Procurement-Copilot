<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#F4F7FB"/>
<style>
.title{font:700 48px Arial,sans-serif;fill:#132238}.h2{font:700 30px Arial,sans-serif;fill:#132238}.h3{font:700 22px Arial,sans-serif;fill:#132238}.body{font:400 20px Arial,sans-serif;fill:#132238}.small{font:400 16px Arial,sans-serif;fill:#5B6B7F}.tiny{font:400 14px Arial,sans-serif;fill:#5B6B7F}.white{fill:#fff}.bold{font-weight:700}
</style><rect x="0" y="0" width="1600" height="120" fill="#0B1F3A"/><text x="70" y="75" class="title" text-anchor="start" fill="#fff">AI Procurement Copilot v1.2</text><text x="70" y="165" class="h2" text-anchor="start">Governed RFQ comparison and sourcing evaluation</text><text x="70" y="205" class="small" text-anchor="start">Portfolio demonstration • Read-only • Validation-gated • No live ERP integration</text><rect x="70" y="245" width="190" height="36" rx="18" fill="#1F5EFF" opacity="0.10"/><text x="165.0" y="269" text-anchor="middle" style="font:700 14px Arial;fill:#1F5EFF">Portfolio demonstration</text><rect x="280" y="245" width="110" height="36" rx="18" fill="#13795B" opacity="0.10"/><text x="335.0" y="269" text-anchor="middle" style="font:700 14px Arial;fill:#13795B">Read-only</text><rect x="410" y="245" width="150" height="36" rx="18" fill="#A15C00" opacity="0.10"/><text x="485.0" y="269" text-anchor="middle" style="font:700 14px Arial;fill:#A15C00">Validation-gated</text><rect x="580" y="245" width="210" height="36" rx="18" fill="#B42318" opacity="0.10"/><text x="685.0" y="269" text-anchor="middle" style="font:700 14px Arial;fill:#B42318">No live ERP integration</text><rect x="70" y="330" width="470" height="400" rx="20" fill="#FFFFFF" stroke="#D8E0EA"/><text x="105" y="385" class="h3" text-anchor="start">Business problem</text><text x="105" y="430" class="body" text-anchor="start">Supplier quotations are often compared</text><text x="105" y="462" class="body" text-anchor="start">across fragmented spreadsheets, inconsistent</text><text x="105" y="494" class="body" text-anchor="start">assumptions and unclear decision controls.</text><rect x="565" y="330" width="470" height="400" rx="20" fill="#FFFFFF" stroke="#D8E0EA"/><text x="600" y="385" class="h3" text-anchor="start">Decision support</text><text x="600" y="430" class="body" text-anchor="start">Compare cost, risk, delivery, quality and</text><text x="600" y="462" class="body" text-anchor="start">commercial terms before preparing a</text><text x="600" y="494" class="body" text-anchor="start">human-reviewed sourcing recommendation.</text><rect x="1060" y="330" width="470" height="400" rx="20" fill="#FFFFFF" stroke="#D8E0EA"/><text x="1095" y="385" class="h3" text-anchor="start">Governance boundary</text><text x="1095" y="430" class="body" text-anchor="start">The application does not execute awards,</text><text x="1095" y="462" class="body" text-anchor="start">write back to ERP or claim realized savings.</text><text x="1095" y="494" class="body" text-anchor="start">Human procurement approval remains mandatory.</text><rect x="70" y="760" width="1460" height="80" rx="18" fill="#EAF0FF" stroke="#C5D3FF"/><text x="800" y="810" class="h3" text-anchor="middle">Inputs → Validation → Category-aware comparison → Executive outputs → Human review</text></svg>