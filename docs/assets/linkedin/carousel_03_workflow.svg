<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#0B1F3A"/><text x="90" y="120" font-family="Arial" font-size="48" font-weight="700" fill="#fff">3 — How the workflow works</text><text x="90" y="185" font-family="Arial" font-size="28" fill="#C8D8FF">A repeatable journey from input to human approval.</text><rect x="90" y="260" width="1420" height="520" rx="28" fill="#fff"/><g font-family="Arial" font-size="22" fill="#132238"><circle cx="145" cy="340" r="22" fill="#1F5EFF"/><text x="145" y="348" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="190" y="348">Load synthetic or user-provided RFQ data</text><circle cx="145" cy="445" r="22" fill="#1F5EFF"/><text x="145" y="453" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="190" y="453">Validate structure, quality, currency and units</text><circle cx="145" cy="550" r="22" fill="#1F5EFF"/><text x="145" y="558" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="190" y="558">Compare cost, risk and commercial factors</text><circle cx="145" cy="655" r="22" fill="#1F5EFF"/><text x="145" y="663" text-anchor="middle" fill="#fff" font-weight="700">4</text><text x="190" y="663">Prepare governed outputs for human procurement review</text></g><text x="90" y="845" font-family="Arial" font-size="16" fill="#B9CBE0">AI Procurement Copilot v1.2 • Portfolio Presentation Release</text></svg>