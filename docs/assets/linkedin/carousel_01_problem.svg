<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#0B1F3A"/><text x="90" y="120" font-family="Arial" font-size="48" font-weight="700" fill="#fff">1 — The procurement problem</text><text x="90" y="185" font-family="Arial" font-size="28" fill="#C8D8FF">Supplier comparisons are often fragmented and hard to defend.</text><rect x="90" y="260" width="1420" height="520" rx="28" fill="#fff"/><g font-family="Arial" font-size="24" fill="#132238"><circle cx="145" cy="360" r="22" fill="#1F5EFF"/><text x="145" y="368" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="190" y="368">Lowest price can hide total-cost and risk exposure</text><circle cx="145" cy="500" r="22" fill="#1F5EFF"/><text x="145" y="508" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="190" y="508">Assumptions and evidence may be inconsistent</text><circle cx="145" cy="640" r="22" fill="#1F5EFF"/><text x="145" y="648" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="190" y="648">Incomplete data can still produce overconfident recommendations</text></g><text x="90" y="845" font-family="Arial" font-size="16" fill="#B9CBE0">AI Procurement Copilot v1.2 • Portfolio Presentation Release</text></svg>