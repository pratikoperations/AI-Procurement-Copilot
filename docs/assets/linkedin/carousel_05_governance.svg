<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#0B1F3A"/><text x="90" y="120" font-family="Arial" font-size="48" font-weight="700" fill="#fff">5 — Validation, governance and testing</text><text x="90" y="185" font-family="Arial" font-size="28" fill="#C8D8FF">High-impact controls remain transparent and testable.</text><rect x="90" y="260" width="1420" height="520" rx="28" fill="#fff"/><g font-family="Arial" font-size="22" fill="#132238"><circle cx="145" cy="340" r="22" fill="#1F5EFF"/><text x="145" y="348" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="190" y="348">Award language can be withheld</text><circle cx="145" cy="445" r="22" fill="#1F5EFF"/><text x="145" y="453" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="190" y="453">Original and normalized values remain visible</text><circle cx="145" cy="550" r="22" fill="#1F5EFF"/><text x="145" y="558" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="190" y="558">Full regression suite and Streamlit smoke are required</text><circle cx="145" cy="655" r="22" fill="#1F5EFF"/><text x="145" y="663" text-anchor="middle" fill="#fff" font-weight="700">4</text><text x="190" y="663">Human procurement approval remains mandatory</text></g><text x="90" y="845" font-family="Arial" font-size="16" fill="#B9CBE0">AI Procurement Copilot v1.2 • Portfolio Presentation Release</text></svg>